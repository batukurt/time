<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Time</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0c0c0e;
      --card-border: #242429;
      --text-main: #ffffff;
      --text-muted: #8e8e99;
      --lux-red: #D94848;
      --lux-white: #FFFFFF;
      --lux-blue: #3AAFE3;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --lux-red: #c93b3b;
      --lux-white: #0f172a;
      --lux-blue: #2395cb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow: hidden;
    }

    .dashboard {
      height: 100dvh;
      width: 100dvw;
      padding: clamp(0.5rem, 1.2vw, 1rem) clamp(0.75rem, 2vw, 1.8rem);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* TOP CENTER STACK */
    .top-center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 100%;
      z-index: 10;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: clamp(8px, 1.2vw, 14px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: clamp(4px, 0.7vh, 7px) clamp(14px, 1.8vw, 22px);
      border-radius: 9999px;
    }
    .date-iso {
      font-size: clamp(0.95rem, 1.3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--lux-blue);
      font-variant-numeric: tabular-nums;
    }
    .day-name {
      font-size: clamp(0.7rem, 0.9vw, 0.88rem);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .location-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 3px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .loc-city {
      font-size: clamp(0.7rem, 0.85vw, 0.84rem);
      font-weight: 700;
    }
    .loc-tz {
      font-size: clamp(0.62rem, 0.78vw, 0.75rem);
      color: var(--lux-blue);
      font-weight: 600;
    }

    .weather-forecast-strip {
      display: flex;
      gap: clamp(4px, 0.5vw, 6px);
    }
    .weather-cell {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: clamp(3px, 0.5vh, 4px) clamp(5px, 0.7vw, 8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: clamp(38px, 4vw, 50px);
    }
    .weather-hour {
      font-size: clamp(0.56rem, 0.68vw, 0.65rem);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .weather-icon {
      font-size: clamp(0.7rem, 0.9vw, 0.9rem);
      margin: 1px 0;
    }
    .weather-temp {
      font-size: clamp(0.66rem, 0.82vw, 0.78rem);
      font-weight: 700;
    }
    .weather-pop {
      font-size: clamp(0.5rem, 0.65vw, 0.62rem);
      color: var(--lux-blue);
      font-weight: 600;
    }

    .controls-container {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 3px 6px;
      border-radius: 9999px;
    }

    .btn-toggle {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 3px 9px;
      font-size: clamp(0.66rem, 0.8vw, 0.78rem);
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn-toggle.active {
      background: var(--lux-red);
      color: #ffffff;
    }
    .btn-toggle:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255,255,255,0.06);
    }
    .btn-icon {
      padding: 3px 7px;
    }
    .btn-icon svg {
      display: block;
    }

    /* CENTER CLOCK STAGE: Position-Locked */
    .center-clock-stage {
      position: absolute;
      top: 155px;
      bottom: 310px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }

    .clock-stage-inner {
      position: relative;
      width: 100%;
      height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(6.5rem, min(24vw, calc((100dvh - 465px) * 0.94)), 26rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* Absolute Center Colon */
    .clock-colon-anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -54%);
      font-size: 0.55em;
      opacity: 0.28;
      color: var(--text-muted);
      font-weight: 300;
      line-height: 1;
      pointer-events: none;
    }

    /* Hours anchored to the left of the center line */
    .clock-hours-anchor {
      position: absolute;
      right: calc(50% + 0.14em);
      top: 50%;
      transform: translateY(-50%);
      color: var(--lux-red);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Minutes anchored to the right of the center line */
    .clock-minutes-anchor {
      position: absolute;
      left: calc(50% + 0.14em);
      top: 50%;
      transform: translateY(-50%);
      color: var(--lux-white);
      text-align: left;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Trailing seconds & AM/PM decoupled from layout */
    .clock-trailing-anchor {
      position: absolute;
      left: calc(100% + 0.08em);
      bottom: 0.08em;
      display: inline-flex;
      align-items: flex-end;
      gap: 0.05em;
      white-space: nowrap;
      line-height: 1;
    }

    .clock-sec-colon {
      font-size: 0.22em;
      opacity: 0.32;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1;
      margin-bottom: 0.11em;
    }

    .clock-seconds {
      font-size: 0.30em;
      color: var(--lux-blue);
      font-weight: 700;
      opacity: 0.95;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .clock-ampm {
      font-size: 0.15em;
      margin-left: 0.12em;
      color: var(--lux-blue);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1;
      margin-bottom: 0.02em;
    }

    /* BOTTOM CONTAINER */
    .bottom-container {
      position: absolute;
      bottom: clamp(0.5rem, 1.2vw, 1rem);
      left: clamp(0.75rem, 2vw, 1.8rem);
      right: clamp(0.75rem, 2vw, 1.8rem);
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 10;
      pointer-events: auto;
    }

    /* Centered World Hubs Tape */
    .hubs-tape {
      display: flex;
      justify-content: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
      width: 100%;
    }
    .hubs-tape::-webkit-scrollbar { display: none; }

    .hub-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 3px 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.66rem, 0.78vw, 0.76rem);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .hub-name { color: var(--text-muted); font-weight: 500; }
    .hub-time { font-weight: 700; color: var(--text-main); font-variant-numeric: tabular-nums; }
    .hub-offset-badge {
      font-size: 0.7em;
      color: var(--lux-blue);
      background: rgba(58, 175, 227, 0.16);
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 700;
    }

    .tv-multi-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .tv-row-card {
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--card-bg);
      height: 48px;
      width: 100%;
      box-sizing: border-box;
    }

    @media (max-width: 860px) {
      body { overflow-y: auto; }
      .dashboard { height: auto; min-height: 100dvh; }
      .controls-container { flex-wrap: wrap; justify-content: center; }
      .hubs-tape { justify-content: flex-start; }
      .center-clock-stage {
        position: relative;
        top: auto;
        bottom: auto;
        margin: 2.5rem 0;
      }
      .clock-stage-inner { font-size: clamp(4.5rem, 18vw, 7.5rem); }
      .bottom-container {
        position: relative;
        bottom: auto;
        left: auto;
        right: auto;
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Top Center Stack: Date -> Location -> Weather -> Switches -->
    <header class="top-center-container">
      <div class="date-badge">
        <span class="date-iso" id="dateIso">----.--.--</span>
        <span class="day-name" id="dayName">---</span>
      </div>

      <div class="location-card">
        <span class="loc-city" id="locCity">Locating...</span>
        <span class="loc-tz" id="gmtInfo">GMT+2</span>
      </div>

      <!-- Weather Forecast Strip: 8 Hours -->
      <div class="weather-forecast-strip" id="weatherStrip"></div>

      <div class="controls-container">
        <button class="btn-toggle active" id="themeMachine" title="Auto Theme (A)">Auto</button>
        <button class="btn-toggle" id="themeLight" title="Light Theme (L)">Light</button>
        <button class="btn-toggle" id="themeDark" title="Dark Theme (D)">Dark</button>
        <span style="width:1px; height:12px; background:var(--card-border); margin:0 2px;"></span>
        <button class="btn-toggle" id="btnSec" title="Toggle Seconds (S)">Sec: Off</button>
        <button class="btn-toggle active" id="btnFmt" title="Toggle 12/24H (H)">24H</button>
        <button class="btn-toggle" id="btnUnit" title="Toggle Unit (C)">°C</button>
        <span style="width:1px; height:12px; background:var(--card-border); margin:0 2px;"></span>
        <button class="btn-toggle" id="btnData" title="Toggle Markets (M)">Markets: Off</button>
        <span style="width:1px; height:12px; background:var(--card-border); margin:0 2px;"></span>
        <button class="btn-toggle btn-icon" id="btnFullscreen" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen">
          <svg id="fsIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Center Clock: Absolutely Anchored, Zero Lateral Movement -->
    <main class="center-clock-stage">
      <div class="clock-stage-inner">
        <!-- Pinned Center Colon -->
        <span class="clock-colon-anchor">:</span>

        <!-- Left Half: Hours -->
        <div class="clock-hours-anchor">
          <span id="mainHours">00</span>
        </div>

        <!-- Right Half: Minutes + Floating Seconds -->
        <div class="clock-minutes-anchor">
          <span id="mainMinutes">00</span>
          <div class="clock-trailing-anchor">
            <span id="colonSec" class="clock-sec-colon" style="display:none;">:</span>
            <span id="mainSeconds" class="clock-seconds" style="display:none;">00</span>
            <span id="mainAmpm" class="clock-ampm" style="display:none;">AM</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Container: World Hubs + Markets Stack -->
    <footer class="bottom-container">
      <div class="hubs-tape" id="timesTape"></div>

      <!-- Hidden by default -->
      <div class="tv-multi-stack" id="tvMultiStack" style="display: none;">
        <div class="tv-row-card" id="tvCurrencies"></div>
        <div class="tv-row-card" id="tvIndices"></div>
        <div class="tv-row-card" id="tvMetals"></div>
        <div class="tv-row-card" id="tvCommodities"></div>
        <div class="tv-row-card" id="tvCrypto"></div>
      </div>
    </footer>
  </div>

    const TV_COMMODITIES = [

    // 5. Coins
    const TV_CRYPTO = [

    let state = {
      theme: 'machine',
      showSeconds: false,
      use24Hour: true,
      tempUnit: 'C',
      showMarkets: false,
      userLat: null,
      userLon: null,
      weatherData: null
    };

    function renderTvRow(containerId, symbols, colorTheme) {
      const container = document.getElementById(containerId);
      container.innerHTML = '<div class="tradingview-widget-container__widget"></div>';

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
      script.async = true;

      const config = {
        "symbols": symbols,
        "showSymbolLogo": true,
        "isTransparent": false,
        "displayMode": "adaptive",
        "colorTheme": colorTheme,
        "locale": "en"
      };

      script.innerHTML = JSON.stringify(config);
      container.appendChild(script);
    }

    function applyTheme() {
      let resolvedTheme = state.theme;
      if (state.theme === 'machine') {
        resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', resolvedTheme);

      document.getElementById('themeMachine').classList.toggle('active', state.theme === 'machine');
      document.getElementById('themeLight').classList.toggle('active', state.theme === 'light');
      document.getElementById('themeDark').classList.toggle('active', state.theme === 'dark');

      renderTvRow('tvCurrencies', TV_CURRENCIES, resolvedTheme);
      renderTvRow('tvIndices', TV_INDICES, resolvedTheme);
      renderTvRow('tvMetals', TV_METALS, resolvedTheme);
      renderTvRow('tvCommodities', TV_COMMODITIES, resolvedTheme);
      renderTvRow('tvCrypto', TV_CRYPTO, resolvedTheme);
    }

    function updateMainClock() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      document.getElementById('dateIso').textContent = `${yyyy}-${mm}-${dd}`;
      document.getElementById('dayName').textContent = days[now.getDay()];

      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      let ampm = '';
      if (!state.use24Hour) {
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
      }
      const formattedHours = String(hours).padStart(2, '0');

      document.getElementById('mainHours').textContent = formattedHours;
      document.getElementById('mainMinutes').textContent = mins;

      const secEl = document.getElementById('mainSeconds');
      const secColon = document.getElementById('colonSec');
      secEl.textContent = secs;
      secEl.style.display = state.showSeconds ? 'inline-block' : 'none';
      secColon.style.display = state.showSeconds ? 'inline-block' : 'none';

      const ampmEl = document.getElementById('mainAmpm');
      ampmEl.textContent = ampm;
      ampmEl.style.display = !state.use24Hour ? 'inline-block' : 'none';

      const offsetMinutes = -now.getTimezoneOffset();
      const offsetHours = offsetMinutes / 60;
      const sign = offsetHours >= 0 ? '+' : '';
      document.getElementById('gmtInfo').textContent = `GMT${sign}${offsetHours}`;
    }

    function updateHubTimes() {
      const now = new Date();
      const hubsWithTime = HUBS.map(hub => {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: hub.zone,
          hour: 'numeric',
          minute: 'numeric',
          hour12: false,
          day: 'numeric'
        }).formatToParts(now);

        const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
        const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
        const day = parseInt(parts.find(p => p.type === 'day').value, 10);

        let formattedTime = '';
        if (state.use24Hour) {
          formattedTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        } else {
          const ampm = h >= 12 ? 'PM' : 'AM';
          const h12 = h % 12 || 12;
          formattedTime = `${String(h12).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
        }

        const dayDiff = day - now.getDate();
        let offsetTag = '';
        if (dayDiff === 1 || dayDiff < -25) { offsetTag = '+1d'; }
        else if (dayDiff === -1 || dayDiff > 25) { offsetTag = '-1d'; }

        return { ...hub, formattedTime, offsetTag };
      });

      const listContainer = document.getElementById('timesTape');
      listContainer.innerHTML = hubsWithTime.map(h => `
        <div class="hub-pill">
          <span class="hub-name">${h.name}</span>
          ${h.offsetTag ? `<span class="hub-offset-badge">${h.offsetTag}</span>` : ''}
          <span class="hub-time">${h.formattedTime}</span>
        </div>
      `).join('');
    }

    function getWeatherIcon(code) {
      if (code === 0) return '☀️';
      if (code === 1 || code === 2) return '🌤️';
      if (code === 3) return '☁️';
      if (code === 45 || code === 48) return '🌫️';
      if (code >= 51 && code <= 57) return '🌦️';
      if (code >= 61 && code <= 67) return '🌧️';
      if (code >= 71 && code <= 77) return '🌨️';
      if (code >= 80 && code <= 82) return '🌧️';
      if (code >= 85 && code <= 86) return '🌨️';
      if (code >= 95 && code <= 99) return '⛈️';
      return '⛅';
    }

    function renderWeatherStrip() {
      if (!state.weatherData) return;
      const now = new Date();
      const currentH = now.getHours();
      const strip = document.getElementById('weatherStrip');

      strip.innerHTML = state.weatherData.map((item, idx) => {
        const forecastDate = new Date(now);
        forecastDate.setHours(currentH + idx);
        const hVal = forecastDate.getHours();

        let hourLabel = '';
        if (state.use24Hour) {
          hourLabel = `${String(hVal).padStart(2, '0')}:00`;
        } else {
          const ampm = hVal >= 12 ? 'PM' : 'AM';
          const h12 = hVal % 12 || 12;
          hourLabel = `${String(h12).padStart(2, '0')} ${ampm}`;
        }

        const tempVal = state.tempUnit === 'C'
          ? `${Math.round(item.tempC)}°`
          : `${Math.round((item.tempC * 9/5) + 32)}°`;

        return `
          <div class="weather-cell">
            <span class="weather-hour">${hourLabel}</span>
            <span class="weather-icon">${item.icon}</span>
            <span class="weather-temp">${tempVal}</span>
            <span class="weather-pop">${item.pop}%</span>
          </div>
        `;
      }).join('');
    }

    async function fetchLiveWeather(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=2&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();

        const currentHourISO = new Date().toISOString().slice(0, 13) + ":00";
        let startIndex = data.hourly.time.findIndex(t => t.startsWith(currentHourISO));
        if (startIndex === -1) startIndex = 0;

        const next8Hours = [];
        for (let i = 0; i < 8; i++) {
          const idx = startIndex + i;
          if (idx < data.hourly.time.length) {
            next8Hours.push({
              tempC: data.hourly.temperature_2m[idx],
              pop: data.hourly.precipitation_probability[idx] || 0,
              icon: getWeatherIcon(data.hourly.weather_code[idx])
            });
          }
        }

        state.weatherData = next8Hours;
        renderWeatherStrip();
      } catch (e) {}
    }

    async function resolveLocationAndWeather() {
      const setLocationLabel = (city, country) => {
        const label = city ? `${city}, ${country}` : country;
        document.getElementById('locCity').textContent = label;
      };

      const handleCoordinates = async (lat, lon) => {
        state.userLat = lat;
        state.userLon = lon;
        try {
          const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
          if (geoRes.ok) {
            const geoData = await geoRes.json();
            const city = geoData.city || geoData.locality || geoData.principalSubdivision || "Current Location";
            const country = geoData.countryName || geoData.countryCode || "";
            setLocationLabel(city, country);
          }
        } catch (e) {
          setLocationLabel("Local Area", "");
        }
        await fetchLiveWeather(lat, lon);
      };

      const ipFallback = async () => {
        try {
          const ipRes = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en');
          if (ipRes.ok) {
            const data = await ipRes.json();
            const city = data.city || data.locality || data.principalSubdivision || "Current Location";
            const country = data.countryName || data.countryCode || "";
            setLocationLabel(city, country);
            if (data.latitude && data.longitude) {
              await fetchLiveWeather(data.latitude, data.longitude);
              return;
            }
          }
        } catch (e) {}
        setLocationLabel("Kirchberg", "Luxembourg");
        await fetchLiveWeather(49.6266, 6.1581);
      };

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          pos => handleCoordinates(pos.coords.latitude, pos.coords.longitude),
          () => ipFallback(),
          { timeout: 7000 }
        );
      } else {
        await ipFallback();
      }
    }

    // Toggle Actions Handlers
    function toggleSeconds() {
      state.showSeconds = !state.showSeconds;
      document.getElementById('btnSec').textContent = state.showSeconds ? 'Sec: On' : 'Sec: Off';
      document.getElementById('btnSec').classList.toggle('active', state.showSeconds);
      updateMainClock();
    }

    function toggleFormat() {
      state.use24Hour = !state.use24Hour;
      document.getElementById('btnFmt').textContent = state.use24Hour ? '24H' : '12H';
      updateMainClock();
      updateHubTimes();
      renderWeatherStrip();
    }

    function toggleTemperatureUnit() {
      state.tempUnit = state.tempUnit === 'C' ? 'F' : 'C';
      document.getElementById('btnUnit').textContent = `°${state.tempUnit}`;
      renderWeatherStrip();
    }

    function toggleMarkets() {
      state.showMarkets = !state.showMarkets;
      document.getElementById('btnData').textContent = state.showMarkets ? 'Markets: On' : 'Markets: Off';
      document.getElementById('btnData').classList.toggle('active', state.showMarkets);
      document.getElementById('tvMultiStack').style.display = state.showMarkets ? 'flex' : 'none';
    }

    function setTheme(theme) {
      state.theme = theme;
      applyTheme();
    }

    // Fullscreen Toggle
    const btnFullscreen = document.getElementById('btnFullscreen');
    const fsIcon = document.getElementById('fsIcon');

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`Fullscreen error: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function updateFsIcon() {
      const isFs = !!document.fullscreenElement;
      btnFullscreen.classList.toggle('active', isFs);
      if (isFs) {
        fsIcon.innerHTML = '<path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6 7 7M4 10h6m0 0V4m0 6L3 3m17 7h-6m0 0V4m0 6 7-7"/>';
      } else {
        fsIcon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
      }
    }

    btnFullscreen.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFsIcon);

    // Mouse Controls
    document.getElementById('themeMachine').onclick = () => setTheme('machine');
    document.getElementById('themeLight').onclick = () => setTheme('light');
    document.getElementById('themeDark').onclick = () => setTheme('dark');
    document.getElementById('btnSec').onclick = toggleSeconds;
    document.getElementById('btnFmt').onclick = toggleFormat;
    document.getElementById('btnUnit').onclick = toggleTemperatureUnit;
    document.getElementById('btnData').onclick = toggleMarkets;

    // Comprehensive Keyboard Shortcuts: 'C' toggles between °C and °F
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.isComposing) return;
      const key = e.key.toLowerCase();

      switch (key) {
        case 'm':
          e.preventDefault();
          toggleMarkets();
          break;
        case 'h':
          e.preventDefault();
          toggleFormat();
          break;
        case 's':
          e.preventDefault();
          toggleSeconds();
          break;
        case 'l':
          e.preventDefault();
          setTheme('light');
          break;
        case 'd':
          e.preventDefault();
          setTheme('dark');
          break;
        case 'a':
          e.preventDefault();
          setTheme('machine');
          break;
        case 'c':
          e.preventDefault();
          toggleTemperatureUnit();
          break;
        case 'f':
          e.preventDefault();
          toggleFullscreen();
          break;
      }
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'machine') applyTheme();
    });

    applyTheme();
    updateMainClock();
    updateHubTimes();
    resolveLocationAndWeather();

    setInterval(updateMainClock, 1000);
    setInterval(updateHubTimes, 10000);
    setInterval(() => {
      if (state.userLat && state.userLon) {
        fetchLiveWeather(state.userLat, state.userLon);
      }
    }, 900000);
  </script>
</body>
</html>
