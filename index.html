<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Time & Market Hubs Dashboard</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #09090b;
      --card-border: #222227;
      --text-main: #ffffff;
      --text-muted: #8e8e99;
      --lux-red: #D94848;
      --lux-white: #FFFFFF;
      --lux-blue: #3AAFE3;
      --stock-green: #34d399;
      --stock-red: #f87171;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --lux-red: #c93b3b;
      --lux-white: #0f172a;
      --lux-blue: #2395cb;
      --stock-green: #059669;
      --stock-red: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Scalable layout container using dynamic viewport units (dvh/dvw) */
    .dashboard {
      min-height: 100dvh;
      width: 100dvw;
      padding: clamp(1rem, 2.5vw, 2rem) clamp(1rem, 3.5vw, 3rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
    }

    /* Top: Centered Date */
    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      width: 100%;
    }

    .date-badge {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 18px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: clamp(6px, 1vw, 9px) clamp(14px, 2vw, 27px);
      border-radius: 9999px;
      backdrop-filter: blur(8px);
    }
    .date-iso {
      font-size: clamp(1rem, 2.2vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--lux-blue);
      font-variant-numeric: tabular-nums;
    }
    .day-name {
      font-size: clamp(0.75rem, 1.4vw, 1.25rem);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Responsive Main Clock: layered seamlessly in background */
    .center-clock-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }
    .clock-digits {
      font-size: clamp(4.5rem, 23vw, 24rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
    }
    .clock-hours {
      color: var(--lux-red);
    }
    .clock-colon {
      opacity: 0.16;
      margin: 0 0.04em;
      color: var(--text-muted);
      font-weight: 400;
    }
    .clock-minutes {
      color: var(--lux-white);
    }
    .clock-sec-colon {
      opacity: 0.16;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 0.06em;
      margin-right: 0.02em;
    }
    .clock-seconds {
      font-size: 0.28em;
      color: var(--lux-blue);
      font-weight: 700;
      opacity: 0.95;
    }
    .clock-ampm {
      font-size: 0.16em;
      margin-left: 0.18em;
      color: var(--lux-blue);
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* Bottom Section */
    .bottom-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: clamp(1rem, 2.5vw, 3rem);
      z-index: 10;
      pointer-events: auto;
      width: 100%;
    }

    /* Left: Vertically Stacked Hubs */
    .hubs-vertical-list {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.8vh, 7px);
      max-height: 48dvh;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }
    .hubs-vertical-list::-webkit-scrollbar {
      width: 4px;
    }
    .hubs-vertical-list::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    .hub-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: clamp(4px, 0.7vh, 7px) clamp(8px, 1.2vw, 16px);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(8px, 1.5vw, 18px);
      font-size: clamp(0.75rem, 1.2vw, 1.05rem);
      width: clamp(260px, 32vw, 440px);
    }
    .hub-name-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .hub-name {
      color: var(--text-muted);
      font-weight: 500;
    }
    .hub-ticker {
      font-size: 0.75em;
      color: var(--text-muted);
      opacity: 0.75;
      font-weight: 600;
    }
    .hub-time-box {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(4px, 0.8vw, 10px);
    }
    .hub-day-offset-slot {
      width: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hub-day-offset {
      font-size: 0.75em;
      color: var(--lux-blue);
      font-weight: 700;
      background: rgba(58, 175, 227, 0.14);
      padding: 1px 4px;
      border-radius: 4px;
      line-height: 1;
    }
    .hub-time {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      min-width: 44px;
      text-align: right;
    }
    .hub-market-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      font-size: 0.82em;
      font-variant-numeric: tabular-nums;
      min-width: 98px;
      justify-content: flex-end;
    }
    .stock-close {
      color: var(--text-main);
      font-weight: 600;
    }
    .stock-chg {
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 1px;
    }
    .stock-up { color: var(--stock-green); }
    .stock-down { color: var(--stock-red); }

    /* Right Stack */
    .right-corner-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: clamp(6px, 1.2vh, 12px);
    }

    .controls-container {
      display: flex;
      gap: 3px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 6px;
      border-radius: 9999px;
    }

    .btn-toggle {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: clamp(4px, 0.7vh, 6px) clamp(8px, 1.1vw, 14px);
      font-size: clamp(0.72rem, 1.1vw, 1.05rem);
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn-toggle.active {
      background: var(--lux-red);
      color: #ffffff;
    }
    .btn-toggle:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255,255,255,0.06);
    }

    .weather-forecast-strip {
      display: flex;
      justify-content: flex-end;
      gap: clamp(4px, 0.6vw, 8px);
    }
    .weather-cell {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 9px;
      padding: clamp(3px, 0.6vh, 6px) clamp(6px, 0.8vw, 10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: clamp(46px, 5.5vw, 68px);
    }
    .weather-hour {
      font-size: clamp(0.65rem, 0.95vw, 0.92rem);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .weather-icon {
      font-size: clamp(0.85rem, 1.3vw, 1.3rem);
      margin: 1px 0;
    }
    .weather-temp {
      font-size: clamp(0.75rem, 1.15vw, 1.1rem);
      font-weight: 700;
    }
    .weather-pop {
      font-size: clamp(0.6rem, 0.9vw, 0.88rem);
      color: var(--lux-blue);
      font-weight: 600;
    }

    .location-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: clamp(5px, 0.9vh, 9px) clamp(10px, 1.5vw, 20px);
      text-align: right;
      white-space: nowrap;
    }
    .loc-city {
      font-size: clamp(0.8rem, 1.3vw, 1.25rem);
      font-weight: 700;
    }
    .loc-tz {
      font-size: clamp(0.68rem, 1.1vw, 1.05rem);
      color: var(--lux-blue);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Phone & Tablet Responsive Overrides */
    @media (max-width: 860px) {
      .dashboard {
        padding: 1rem;
        gap: 1.2rem;
        min-height: auto;
      }
      .center-clock-stage {
        position: relative;
        margin: 1.5rem 0;
      }
      .clock-digits {
        font-size: clamp(4.5rem, 20vw, 8rem);
      }
      .bottom-row {
        flex-direction: column-reverse;
        align-items: stretch;
        gap: 1.25rem;
      }
      .hubs-vertical-list {
        max-height: none;
        width: 100%;
      }
      .hub-pill {
        width: 100%;
        min-width: unset;
      }
      .right-corner-stack {
        align-items: stretch;
        width: 100%;
      }
      .controls-container {
        justify-content: center;
        flex-wrap: wrap;
      }
      .weather-forecast-strip {
        justify-content: space-between;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .location-card {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Top Centered Date -->
    <header class="top-bar">
      <div class="date-badge">
        <span class="date-iso" id="dateIso">----.--.--</span>
        <span class="day-name" id="dayName">---</span>
      </div>
    </header>

    <!-- Scalable Center Clock -->
    <main class="center-clock-stage">
      <div class="clock-digits">
        <span id="mainHours" class="clock-hours">00</span>
        <span class="clock-colon">:</span>
        <span id="mainMinutes" class="clock-minutes">00</span>
        <span id="colonSec" class="clock-sec-colon" style="display:none;">:</span>
        <span id="mainSeconds" class="clock-seconds" style="display:none;">00</span>
        <span id="mainAmpm" class="clock-ampm" style="display:none;">AM</span>
      </div>
    </main>

    <!-- Bottom Section: Hubs on Left, Stacked Controls on Right -->
    <div class="bottom-row">
      <!-- 5 Selected Hubs -->
      <div class="hubs-vertical-list" id="hubsList"></div>

      <!-- Right Column: Switches, Weather, Location -->
      <div class="right-corner-stack">
        <!-- Switches -->
        <div class="controls-container">
          <button class="btn-toggle active" id="themeMachine">Auto</button>
          <button class="btn-toggle" id="themeLight">Light</button>
          <button class="btn-toggle" id="themeDark">Dark</button>
          <span style="width:1px; background:var(--card-border); margin:2px 1px;"></span>
          <button class="btn-toggle" id="btnSec">Sec: Off</button>
          <button class="btn-toggle active" id="btnFmt">24H</button>
          <button class="btn-toggle" id="btnUnit">°C</button>
        </div>

        <!-- Hourly Weather Strip -->
        <div class="weather-forecast-strip" id="weatherStrip"></div>

        <!-- Location Card -->
        <div class="location-card">
          <div class="loc-city">Kirchberg, Luxembourg</div>
          <div class="loc-tz" id="gmtInfo">GMT+2</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const HUBS = [
      {
        name: "Cayman Islands",
        zone: "America/Cayman",
        ticker: "CSX",
        close: "1,248.50",
        chg: "+0.15%",
        up: true
      },
      {
        name: "New York",
        zone: "America/New_York",
        ticker: "S&P 500",
        close: "5,864.67",
        chg: "+0.42%",
        up: true
      },
      {
        name: "Dublin",
        zone: "Europe/Dublin",
        ticker: "ISEQ 20",
        close: "9,642.10",
        chg: "-0.28%",
        up: false
      },
      {
        name: "London",
        zone: "Europe/London",
        ticker: "FTSE 100",
        close: "8,276.45",
        chg: "+0.31%",
        up: true
      },
      {
        name: "Istanbul",
        zone: "Europe/Istanbul",
        ticker: "BIST 100",
        close: "9,780.20",
        chg: "-0.64%",
        up: false
      }
    ];

    let state = {
      theme: 'machine',
      showSeconds: false,
      use24Hour: true,
      tempUnit: 'C'
    };

    function applyTheme() {
      if (state.theme === 'machine') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-theme', state.theme);
      }
      document.getElementById('themeMachine').classList.toggle('active', state.theme === 'machine');
      document.getElementById('themeLight').classList.toggle('active', state.theme === 'light');
      document.getElementById('themeDark').classList.toggle('active', state.theme === 'dark');
    }

    function updateMainClock() {
      const now = new Date();

      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      document.getElementById('dateIso').textContent = `${yyyy}-${mm}-${dd}`;
      document.getElementById('dayName').textContent = days[now.getDay()];

      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      let ampm = '';
      if (!state.use24Hour) {
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
      }
      const formattedHours = state.use24Hour ? String(hours).padStart(2, '0') : String(hours);

      document.getElementById('mainHours').textContent = formattedHours;
      document.getElementById('mainMinutes').textContent = mins;

      const secEl = document.getElementById('mainSeconds');
      const secColon = document.getElementById('colonSec');
      secEl.textContent = secs;
      secEl.style.display = state.showSeconds ? 'inline' : 'none';
      secColon.style.display = state.showSeconds ? 'inline' : 'none';

      const ampmEl = document.getElementById('mainAmpm');
      ampmEl.textContent = ampm;
      ampmEl.style.display = !state.use24Hour ? 'inline' : 'none';

      const offsetMinutes = -now.getTimezoneOffset();
      const offsetHours = offsetMinutes / 60;
      const sign = offsetHours >= 0 ? '+' : '';
      document.getElementById('gmtInfo').textContent = `(GMT${sign}${offsetHours})`;
    }

    function updateHubs() {
      const now = new Date();
      const sorted = HUBS.map(hub => {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: hub.zone,
          hour: 'numeric',
          minute: 'numeric',
          hour12: false,
          day: 'numeric'
        }).formatToParts(now);

        const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
        const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
        const day = parseInt(parts.find(p => p.type === 'day').value, 10);

        let formattedTime = '';
        if (state.use24Hour) {
          formattedTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        } else {
          const ampm = h >= 12 ? 'PM' : 'AM';
          const h12 = h % 12 || 12;
          formattedTime = `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
        }

        const dayDiff = day - now.getDate();
        const isNextDay = (dayDiff === 1 || dayDiff < -25);
        const isPrevDay = (dayDiff === -1 || dayDiff > 25);

        let offsetTag = '';
        let dayOrder = 0;
        if (isNextDay) {
          offsetTag = '+1d';
          dayOrder = 1;
        } else if (isPrevDay) {
          offsetTag = '-1d';
          dayOrder = -1;
        }

        return {
          ...hub,
          minutesTotal: h * 60 + m,
          dayOrder,
          formattedTime,
          offsetTag
        };
      }).sort((a, b) => {
        if (a.dayOrder !== b.dayOrder) {
          return a.dayOrder - b.dayOrder;
        }
        return a.minutesTotal - b.minutesTotal;
      });

      const hubsContainer = document.getElementById('hubsList');
      hubsContainer.innerHTML = sorted.map(h => `
        <div class="hub-pill">
          <div class="hub-name-group">
            <span class="hub-name">${h.name}</span>
            <span class="hub-ticker">${h.ticker}</span>
          </div>
          <div class="hub-time-box">
            <div class="hub-day-offset-slot">
              ${h.offsetTag ? `<span class="hub-day-offset">${h.offsetTag}</span>` : ''}
            </div>
            <span class="hub-time">${h.formattedTime}</span>
            <div class="hub-market-badge">
              <span class="stock-close">${h.close}</span>
              <span class="stock-chg ${h.up ? 'stock-up' : 'stock-down'}">
                ${h.up ? '▲' : '▼'}${h.chg}
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderWeather() {
      const now = new Date();
      const currentH = now.getHours();

      const weatherIcons = ['🌤️', '⛅', '🌥️', '☁️', '🌦️', '🌧️'];
      const temps = [22, 21, 20, 19, 18, 17];
      const pops = [0, 0, 10, 15, 25, 40];

      const strip = document.getElementById('weatherStrip');
      strip.innerHTML = temps.map((c, idx) => {
        const forecastDate = new Date(now);
        forecastDate.setHours(currentH + idx);
        const hVal = forecastDate.getHours();

        let hourLabel = '';
        if (state.use24Hour) {
          hourLabel = `${String(hVal).padStart(2, '0')}:00`;
        } else {
          const ampm = hVal >= 12 ? 'PM' : 'AM';
          const h12 = hVal % 12 || 12;
          hourLabel = `${h12} ${ampm}`;
        }

        const tempVal = state.tempUnit === 'C' ? `${c}°` : `${Math.round(c * 9/5 + 32)}°`;
        return `
          <div class="weather-cell">
            <span class="weather-hour">${hourLabel}</span>
            <span class="weather-icon">${weatherIcons[idx]}</span>
            <span class="weather-temp">${tempVal}</span>
            <span class="weather-pop">${pops[idx]}%</span>
          </div>
        `;
      }).join('');
    }

    document.getElementById('themeMachine').onclick = () => { state.theme = 'machine'; applyTheme(); };
    document.getElementById('themeLight').onclick = () => { state.theme = 'light'; applyTheme(); };
    document.getElementById('themeDark').onclick = () => { state.theme = 'dark'; applyTheme(); };

    document.getElementById('btnSec').onclick = () => {
      state.showSeconds = !state.showSeconds;
      document.getElementById('btnSec').textContent = state.showSeconds ? 'Sec: On' : 'Sec: Off';
      document.getElementById('btnSec').classList.toggle('active', state.showSeconds);
      updateMainClock();
    };

    document.getElementById('btnFmt').onclick = () => {
      state.use24Hour = !state.use24Hour;
      document.getElementById('btnFmt').textContent = state.use24Hour ? '24H' : '12H';
      updateMainClock();
      updateHubs();
      renderWeather();
    };

    document.getElementById('btnUnit').onclick = () => {
      state.tempUnit = state.tempUnit === 'C' ? 'F' : 'C';
      document.getElementById('btnUnit').textContent = `°${state.tempUnit}`;
      renderWeather();
    };

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'machine') applyTheme();
    });

    applyTheme();
    updateMainClock();
    updateHubs();
    renderWeather();

    setInterval(updateMainClock, 1000);
    setInterval(updateHubs, 10000);
    setInterval(renderWeather, 60000);
  </script>
</body>
</html>
