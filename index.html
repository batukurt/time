<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Time</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0c0c0e;
      --card-border: #242429;
      --row-even: #111115;
      --row-odd: #08080a;
      --text-main: #ffffff;
      --text-muted: #8e8e99;
      --lux-red: #D94848;
      --lux-white: #FFFFFF;
      --lux-blue: #3AAFE3;
      --stock-green: #34d399;
      --stock-red: #f87171;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --row-even: #f1f5f9;
      --row-odd: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --lux-red: #c93b3b;
      --lux-white: #0f172a;
      --lux-blue: #2395cb;
      --stock-green: #059669;
      --stock-red: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dashboard {
      min-height: 100dvh;
      width: 100dvw;
      padding: clamp(0.75rem, 1.8vw, 1.5rem) clamp(0.75rem, 2vw, 2rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      width: 100%;
      z-index: 10;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: clamp(8px, 1.2vw, 14px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: clamp(6px, 0.9vh, 9px) clamp(12px, 1.6vw, 22px);
      border-radius: 9999px;
    }
    .date-iso {
      font-size: clamp(0.95rem, 1.4vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--lux-blue);
      font-variant-numeric: tabular-nums;
    }
    .day-name {
      font-size: clamp(0.7rem, 0.95vw, 0.9rem);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .top-right-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .weather-forecast-strip {
      display: flex;
      gap: clamp(4px, 0.5vw, 6px);
    }
    .weather-cell {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: clamp(3px, 0.5vh, 5px) clamp(5px, 0.7vw, 8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: clamp(38px, 4vw, 52px);
    }
    .weather-hour {
      font-size: clamp(0.58rem, 0.7vw, 0.68rem);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .weather-icon {
      font-size: clamp(0.72rem, 0.95vw, 0.95rem);
      margin: 1px 0;
    }
    .weather-temp {
      font-size: clamp(0.68rem, 0.85vw, 0.82rem);
      font-weight: 700;
    }
    .weather-pop {
      font-size: clamp(0.52rem, 0.68vw, 0.65rem);
      color: var(--lux-blue);
      font-weight: 600;
    }

    .location-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 4px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .loc-city {
      font-size: clamp(0.72rem, 0.9vw, 0.88rem);
      font-weight: 700;
    }
    .loc-tz {
      font-size: clamp(0.64rem, 0.8vw, 0.78rem);
      color: var(--lux-blue);
      font-weight: 600;
    }

    .controls-container {
      display: flex;
      gap: 3px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 3px 6px;
      border-radius: 9999px;
    }

    .btn-toggle {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 3px 10px;
      font-size: clamp(0.68rem, 0.85vw, 0.82rem);
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn-toggle.active {
      background: var(--lux-red);
      color: #ffffff;
    }
    .btn-toggle:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255,255,255,0.06);
    }

    /* CENTER STAGE: Giant Clock */
    .center-clock-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }
    .clock-digits {
      font-size: clamp(5rem, 24vw, 24rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
    }
    .clock-hours { color: var(--lux-red); }
    .clock-colon {
      opacity: 0.16;
      margin: 0 0.04em;
      color: var(--text-muted);
      font-weight: 400;
    }
    .clock-minutes { color: var(--lux-white); }
    .clock-sec-colon {
      opacity: 0.16;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 0.06em;
      margin-right: 0.02em;
    }
    .clock-seconds {
      font-size: 0.28em;
      color: var(--lux-blue);
      font-weight: 700;
      opacity: 0.95;
    }
    .clock-ampm {
      font-size: 0.16em;
      margin-left: 0.18em;
      color: var(--lux-blue);
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* BOTTOM STRIP: 6 columns with alternating shaded rows */
    .market-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(6px, 0.8vw, 12px);
      width: 100%;
      z-index: 10;
      pointer-events: auto;
    }

    .market-col {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .market-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      height: 27px;
      padding: 0 9px;
      font-size: clamp(0.68rem, 0.76vw, 0.82rem);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .market-item:last-child {
      border-bottom: none;
    }

    .market-item:nth-child(even) { background: var(--row-even); }
    .market-item:nth-child(odd) { background: var(--row-odd); }

    .item-label {
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .item-val-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .item-val {
      font-weight: 600;
      color: var(--text-main);
      text-align: right;
    }

    .item-chg {
      font-weight: 700;
      font-size: 0.88em;
      min-width: 44px;
      text-align: right;
    }
    .stock-up { color: var(--stock-green); }
    .stock-down { color: var(--stock-red); }

    .hub-offset-badge {
      font-size: 0.72em;
      color: var(--lux-blue);
      background: rgba(58, 175, 227, 0.16);
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
      line-height: 1;
    }

    @media (max-width: 1024px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .top-right-group {
        align-items: flex-start;
      }
      .market-strip {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .dashboard {
        min-height: auto;
        gap: 1rem;
        padding: 0.75rem;
      }
      .date-badge {
        justify-content: center;
        width: 100%;
      }
      .top-right-group {
        align-items: stretch;
        width: 100%;
      }
      .location-card, .controls-container {
        justify-content: center;
      }
      .weather-forecast-strip {
        justify-content: space-between;
      }
      .center-clock-stage {
        position: relative;
        margin: 1.2rem 0;
      }
      .clock-digits {
        font-size: clamp(4rem, 18vw, 7rem);
      }
      .market-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="date-badge">
        <span class="date-iso" id="dateIso">----.--.--</span>
        <span class="day-name" id="dayName">---</span>
      </div>

      <div class="top-right-group">
        <div class="weather-forecast-strip" id="weatherStrip"></div>
        <div class="location-card">
          <span class="loc-city">Kirchberg, Luxembourg</span>
          <span class="loc-tz" id="gmtInfo">GMT+2</span>
        </div>
        <div class="controls-container">
          <button class="btn-toggle active" id="themeMachine">Auto</button>
          <button class="btn-toggle" id="themeLight">Light</button>
          <button class="btn-toggle" id="themeDark">Dark</button>
          <span style="width:1px; background:var(--card-border); margin:2px 1px;"></span>
          <button class="btn-toggle" id="btnSec">Sec: Off</button>
          <button class="btn-toggle active" id="btnFmt">24H</button>
          <button class="btn-toggle" id="btnUnit">°C</button>
        </div>
      </div>
    </header>

    <!-- Center Stage -->
    <main class="center-clock-stage">
      <div class="clock-digits">
        <span id="mainHours" class="clock-hours">00</span>
        <span class="clock-colon">:</span>
        <span id="mainMinutes" class="clock-minutes">00</span>
        <span id="colonSec" class="clock-sec-colon" style="display:none;">:</span>
        <span id="mainSeconds" class="clock-seconds" style="display:none;">00</span>
        <span id="mainAmpm" class="clock-ampm" style="display:none;">AM</span>
      </div>
    </main>

    <!-- Bottom Strip -->
    <footer class="market-strip">
      <div class="market-col" id="timesList"></div>
      <div class="market-col" id="colIndices"></div>
      <div class="market-col" id="colCurrencies"></div>
      <div class="market-col" id="colMetals"></div>
      <div class="market-col" id="colCommodities"></div>
      <div class="market-col" id="colCrypto"></div>
    </footer>
  </div>

  <script>
    // -------------------------------------------------------------
    // BASELINE MARKET CONFIGURATION
    // You can adjust any benchmark number or percentage here directly
    // -------------------------------------------------------------
    const MARKET_BENCHMARKS = {
      indices: [
        { label: "BIST 100", val: "9,780.2", chg: "-0.64%", up: false },
        { label: "S&P 500", val: "5,864.7", chg: "+0.42%", up: true },
        { label: "NASDAQ", val: "18,518.6", chg: "+0.63%", up: true },
        { label: "Shanghai", val: "3,261.5", chg: "+0.52%", up: true },
        { label: "FTSE 100", val: "8,276.4", chg: "+0.31%", up: true },
        { label: "DAX 40", val: "19,425.8", chg: "+0.28%", up: true },
        { label: "Nikkei 225", val: "38,925.6", chg: "-0.18%", up: false },
        { label: "EuroStoxx", val: "4,942.3", chg: "+0.22%", up: true }
      ],
      currencies: [
        { id: "gauTry", label: "GAU/TRY", val: "3,025.4", chg: "+0.52%", up: true },
        { id: "eurTry", label: "EUR/TRY", val: "38.45", chg: "+0.22%", up: true },
        { id: "eurUsd", label: "EUR/USD", val: "1.0850", chg: "-0.14%", up: false },
        { id: "eurGbp", label: "EUR/GBP", val: "0.8340", chg: "+0.08%", up: true },
        { id: "eurChf", label: "EUR/CHF", val: "0.9385", chg: "-0.05%", up: false },
        { id: "eurJpy", label: "EUR/JPY", val: "164.20", chg: "+0.35%", up: true },
        { id: "eurAud", label: "EUR/AUD", val: "1.6210", chg: "-0.18%", up: false },
        { id: "usdTry", label: "USD/TRY", val: "35.42", chg: "+0.15%", up: true }
      ],
      metals: [
        { label: "Gold (oz)", val: "$2,658.4", chg: "+0.48%", up: true },
        { label: "Silver (oz)", val: "$31.85", chg: "+1.12%", up: true },
        { label: "Platinum", val: "$985.2", chg: "-0.32%", up: false },
        { label: "Palladium", val: "$1,024.5", chg: "-0.85%", up: false },
        { label: "Rhodium", val: "$4,750.0", chg: "+0.15%", up: true },
        { label: "Steel (HRC)", val: "$720.0", chg: "-0.40%", up: false },
        { label: "Copper (lb)", val: "$4.38", chg: "+0.38%", up: true },
        { label: "Aluminium", val: "$2,610.0", chg: "+0.25%", up: true }
      ],
      commodities: [
        { label: "Brent Crude", val: "$74.25", chg: "+0.65%", up: true },
        { label: "WTI Crude", val: "$70.60", chg: "+0.72%", up: true },
        { label: "Natural Gas", val: "$2.85", chg: "-1.40%", up: false },
        { label: "Iron Ore", val: "$105.20", chg: "-0.30%", up: false },
        { label: "Wheat", val: "$582.50", chg: "-0.45%", up: false },
        { label: "Corn", val: "$415.00", chg: "+0.22%", up: true },
        { label: "Coffee", val: "$252.40", chg: "+1.15%", up: true },
        { label: "Cotton", val: "$72.80", chg: "-0.20%", up: false }
      ],
      crypto: [
        { id: "bitcoin", label: "Bitcoin", val: "$64,350", chg: "+1.85%", up: true },
        { id: "ethereum", label: "Ethereum", val: "$2,640", chg: "+1.20%", up: true },
        { id: "solana", label: "Solana", val: "$154.20", chg: "-0.92%", up: false },
        { id: "binancecoin", label: "BNB", val: "$595.40", chg: "+0.45%", up: true },
        { id: "ripple", label: "XRP", val: "$0.584", chg: "-0.35%", up: false },
        { id: "cardano", label: "Cardano", val: "$0.352", chg: "+0.50%", up: true },
        { id: "avalanche-2", label: "Avalanche", val: "$27.80", chg: "-0.60%", up: false },
        { id: "dogecoin", label: "Dogecoin", val: "$0.114", chg: "+0.80%", up: true }
      ]
    };

    const HUBS = [
      { name: "Cayman Is.", zone: "America/Cayman" },
      { name: "New York", zone: "America/New_York" },
      { name: "London", zone: "Europe/London" },
      { name: "Dublin", zone: "Europe/Dublin" },
      { name: "Istanbul", zone: "Europe/Istanbul" },
      { name: "Hong Kong", zone: "Asia/Hong_Kong" },
      { name: "Tokyo", zone: "Asia/Tokyo" },
      { name: "Sydney", zone: "Australia/Sydney" }
    ];

    let state = {
      theme: 'machine',
      showSeconds: false,
      use24Hour: true,
      tempUnit: 'C'
    };

    function renderColumn(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = items.map(item => `
        <div class="market-item">
          <span class="item-label">${item.label}</span>
          <div class="item-val-group">
            <span class="item-val" id="val_${item.id || item.label}">${item.val}</span>
            <span class="item-chg ${item.up ? 'stock-up' : 'stock-down'}" id="chg_${item.id || item.label}">
              ${item.up ? '▲' : '▼'}${item.chg.replace(/^[+-]/, '')}
            </span>
          </div>
        </div>
      `).join('');
    }

    function renderAllColumns() {
      renderColumn('colIndices', MARKET_BENCHMARKS.indices);
      renderColumn('colCurrencies', MARKET_BENCHMARKS.currencies);
      renderColumn('colMetals', MARKET_BENCHMARKS.metals);
      renderColumn('colCommodities', MARKET_BENCHMARKS.commodities);
      renderColumn('colCrypto', MARKET_BENCHMARKS.crypto);
    }

    function applyTheme() {
      if (state.theme === 'machine') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-theme', state.theme);
      }
      document.getElementById('themeMachine').classList.toggle('active', state.theme === 'machine');
      document.getElementById('themeLight').classList.toggle('active', state.theme === 'light');
      document.getElementById('themeDark').classList.toggle('active', state.theme === 'dark');
    }

    function updateMainClock() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      document.getElementById('dateIso').textContent = `${yyyy}-${mm}-${dd}`;
      document.getElementById('dayName').textContent = days[now.getDay()];

      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      let ampm = '';
      if (!state.use24Hour) {
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
      }
      const formattedHours = state.use24Hour ? String(hours).padStart(2, '0') : String(hours);

      document.getElementById('mainHours').textContent = formattedHours;
      document.getElementById('mainMinutes').textContent = mins;

      const secEl = document.getElementById('mainSeconds');
      const secColon = document.getElementById('colonSec');
      secEl.textContent = secs;
      secEl.style.display = state.showSeconds ? 'inline' : 'none';
      secColon.style.display = state.showSeconds ? 'inline' : 'none';

      const ampmEl = document.getElementById('mainAmpm');
      ampmEl.textContent = ampm;
      ampmEl.style.display = !state.use24Hour ? 'inline' : 'none';

      const offsetMinutes = -now.getTimezoneOffset();
      const offsetHours = offsetMinutes / 60;
      const sign = offsetHours >= 0 ? '+' : '';
      document.getElementById('gmtInfo').textContent = `GMT${sign}${offsetHours}`;
    }

    function updateHubTimes() {
      const now = new Date();
      const sorted = HUBS.map(hub => {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: hub.zone,
          hour: 'numeric',
          minute: 'numeric',
          hour12: false,
          day: 'numeric'
        }).formatToParts(now);

        const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
        const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
        const day = parseInt(parts.find(p => p.type === 'day').value, 10);

        let formattedTime = '';
        if (state.use24Hour) {
          formattedTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        } else {
          const ampm = h >= 12 ? 'PM' : 'AM';
          const h12 = h % 12 || 12;
          formattedTime = `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
        }

        const dayDiff = day - now.getDate();
        let offsetTag = '';
        let dayOrder = 0;
        if (dayDiff === 1 || dayDiff < -25) { offsetTag = '+1d'; dayOrder = 1; }
        else if (dayDiff === -1 || dayDiff > 25) { offsetTag = '-1d'; dayOrder = -1; }

        return { ...hub, minutesTotal: h * 60 + m, dayOrder, formattedTime, offsetTag };
      }).sort((a, b) => {
        if (a.dayOrder !== b.dayOrder) return a.dayOrder - b.dayOrder;
        return a.minutesTotal - b.minutesTotal;
      });

      const listContainer = document.getElementById('timesList');
      listContainer.innerHTML = sorted.map(h => `
        <div class="market-item">
          <span class="item-label">${h.name}</span>
          <div class="item-val-group">
            ${h.offsetTag ? `<span class="hub-offset-badge">${h.offsetTag}</span>` : ''}
            <span class="item-val">${h.formattedTime}</span>
          </div>
        </div>
      `).join('');
    }

    function renderWeather() {
      const now = new Date();
      const currentH = now.getHours();
      const weatherIcons = ['🌤️', '⛅', '🌥️', '☁️', '🌦️', '🌧️'];
      const temps = [22, 21, 20, 19, 18, 17];
      const pops = [0, 0, 10, 15, 25, 40];

      const strip = document.getElementById('weatherStrip');
      strip.innerHTML = temps.map((c, idx) => {
        const forecastDate = new Date(now);
        forecastDate.setHours(currentH + idx);
        const hVal = forecastDate.getHours();

        let hourLabel = '';
        if (state.use24Hour) {
          hourLabel = `${String(hVal).padStart(2, '0')}:00`;
        } else {
          const ampm = hVal >= 12 ? 'PM' : 'AM';
          const h12 = hVal % 12 || 12;
          hourLabel = `${h12} ${ampm}`;
        }

        const tempVal = state.tempUnit === 'C' ? `${c}°` : `${Math.round(c * 9/5 + 32)}°`;
        return `
          <div class="weather-cell">
            <span class="weather-hour">${hourLabel}</span>
            <span class="weather-icon">${weatherIcons[idx]}</span>
            <span class="weather-temp">${tempVal}</span>
            <span class="weather-pop">${pops[idx]}%</span>
          </div>
        `;
      }).join('');
    }

    // Dynamic Live Currency & Gold Sync
    async function syncLiveForex() {
      try {
        const res = await fetch('https://api.frankfurter.app/latest?from=EUR&to=TRY,USD,GBP,CHF,JPY,AUD');
        if (!res.ok) return;
        const data = await res.json();
        const r = data.rates;

        const updateVal = (id, text) => {
          const el = document.getElementById(`val_${id}`);
          if (el) el.textContent = text;
        };

        if (r.TRY) updateVal('eurTry', r.TRY.toFixed(2));
        if (r.USD) updateVal('eurUsd', r.USD.toFixed(4));
        if (r.GBP) updateVal('eurGbp', r.GBP.toFixed(4));
        if (r.CHF) updateVal('eurChf', r.CHF.toFixed(4));
        if (r.JPY) updateVal('eurJpy', r.JPY.toFixed(1));
        if (r.AUD) updateVal('eurAud', r.AUD.toFixed(3));

        if (r.USD && r.TRY) {
          const usdTry = r.TRY / r.USD;
          updateVal('usdTry', usdTry.toFixed(2));
          const gauTry = (2658.4 / 31.1034768) * usdTry;
          updateVal('gauTry', gauTry.toLocaleString('en-US', { maximumFractionDigits: 1 }));
        }
      } catch (e) {}
    }

    // Dynamic Live Crypto Sync
    async function syncLiveCrypto() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin,ripple,cardano,avalanche-2,dogecoin&vs_currencies=usd&include_24hr_change=true');
        if (!res.ok) return;
        const data = await res.json();

        const updateItem = (id, isDec) => {
          if (!data[id]) return;
          const price = data[id].usd;
          const chg = data[id].usd_24h_change || 0;
          const valEl = document.getElementById(`val_${id}`);
          const chgEl = document.getElementById(`chg_${id}`);
          if (valEl) valEl.textContent = isDec ? `$${price.toFixed(3)}` : `$${price.toLocaleString()}`;
          if (chgEl) {
            chgEl.textContent = `${chg >= 0 ? '▲' : '▼'}${Math.abs(chg).toFixed(1)}%`;
            chgEl.className = `item-chg ${chg >= 0 ? 'stock-up' : 'stock-down'}`;
          }
        };

        updateItem('bitcoin', false);
        updateItem('ethereum', false);
        updateItem('solana', false);
        updateItem('binancecoin', false);
        updateItem('ripple', true);
        updateItem('cardano', true);
        updateItem('avalanche-2', false);
        updateItem('dogecoin', true);
      } catch (e) {}
    }

    // Toggle controls
    document.getElementById('themeMachine').onclick = () => { state.theme = 'machine'; applyTheme(); };
    document.getElementById('themeLight').onclick = () => { state.theme = 'light'; applyTheme(); };
    document.getElementById('themeDark').onclick = () => { state.theme = 'dark'; applyTheme(); };

    document.getElementById('btnSec').onclick = () => {
      state.showSeconds = !state.showSeconds;
      document.getElementById('btnSec').textContent = state.showSeconds ? 'Sec: On' : 'Sec: Off';
      document.getElementById('btnSec').classList.toggle('active', state.showSeconds);
      updateMainClock();
    };

    document.getElementById('btnFmt').onclick = () => {
      state.use24Hour = !state.use24Hour;
      document.getElementById('btnFmt').textContent = state.use24Hour ? '24H' : '12H';
      updateMainClock();
      updateHubTimes();
      renderWeather();
    };

    document.getElementById('btnUnit').onclick = () => {
      state.tempUnit = state.tempUnit === 'C' ? 'F' : 'C';
      document.getElementById('btnUnit').textContent = `°${state.tempUnit}`;
      renderWeather();
    };

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'machine') applyTheme();
    });

    // Initialize
    applyTheme();
    updateMainClock();
    updateHubTimes();
    renderWeather();
    renderAllColumns();
    syncLiveForex();
    syncLiveCrypto();

    setInterval(updateMainClock, 1000);
    setInterval(updateHubTimes, 10000);
    setInterval(renderWeather, 60000);
    setInterval(syncLiveForex, 60000);
    setInterval(syncLiveCrypto, 60000);
  </script>
</body>
</html>
