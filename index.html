<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time & Market Hubs Dashboard</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #09090b;
      --card-border: #18181b;
      --text-main: #f4f4f5;
      --text-muted: #71717a;
      --lux-red: #EA141D;
      --lux-white: #FFFFFF;
      --lux-blue: #00A1DE;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --lux-red: #d31018;
      --lux-blue: #0087bc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* eliminates iframe scrollbars */
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .lux-stripe {
      height: 3px;
      width: 100%;
      display: flex;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
    }
    .lux-stripe-red { flex: 1; background: var(--lux-red); }
    .lux-stripe-white { flex: 1; background: var(--lux-white); opacity: 0.85; }
    .lux-stripe-blue { flex: 1; background: var(--lux-blue); }

    .dashboard {
      height: 100vh;
      width: 100vw;
      padding: 1rem 1.5rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.75rem;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
    }

    .date-badge {
      display: flex;
      flex-direction: column;
    }
    .date-iso {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--lux-blue);
      font-variant-numeric: tabular-nums;
    }
    .day-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .controls-container {
      display: flex;
      gap: 0.4rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 6px;
      border-radius: 9999px;
    }

    .btn-toggle {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 11px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .btn-toggle.active {
      background: var(--lux-red);
      color: #ffffff;
    }
    .btn-toggle:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255,255,255,0.06);
    }

    .weather-forecast-strip {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
    }
    .weather-cell {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 4px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 44px;
    }
    .weather-hour { font-size: 0.62rem; color: var(--text-muted); }
    .weather-icon { font-size: 0.85rem; margin: 2px 0; }
    .weather-temp { font-size: 0.75rem; font-weight: 700; }
    .weather-pop { font-size: 0.6rem; color: var(--lux-blue); font-weight: 600; }

    .center-clock-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .clock-digits {
      font-size: clamp(4.5rem, 16vw, 13rem);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
    }
    .clock-seconds {
      font-size: 0.38em;
      margin-left: 0.15em;
      color: var(--lux-blue);
      font-weight: 600;
      opacity: 0.95;
    }
    .clock-ampm {
      font-size: 0.22em;
      margin-left: 0.25em;
      color: var(--lux-red);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .bottom-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      padding-bottom: 0.25rem;
    }
    .hubs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 82%;
    }
    .hub-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 4px 9px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
    }
    .hub-name { color: var(--text-muted); font-weight: 500; }
    .hub-time { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-main); }
    .hub-day-offset { font-size: 0.6rem; color: var(--lux-blue); font-weight: 700; }

    .location-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 9px;
      padding: 6px 12px;
      text-align: right;
      white-space: nowrap;
    }
    .loc-city { font-size: 0.8rem; font-weight: 700; }
    .loc-tz { font-size: 0.68rem; color: var(--lux-blue); font-weight: 600; }
  </style>
</head>
<body>
  <div class="lux-stripe">
    <div class="lux-stripe-red"></div>
    <div class="lux-stripe-white"></div>
    <div class="lux-stripe-blue"></div>
  </div>

  <div class="dashboard">
    <header class="top-bar">
      <div class="date-badge">
        <span class="date-iso" id="dateIso">----.--.--</span>
        <span class="day-name" id="dayName">---</span>
      </div>

      <div class="controls-container">
        <button class="btn-toggle active" id="themeMachine">Auto</button>
        <button class="btn-toggle" id="themeLight">Light</button>
        <button class="btn-toggle" id="themeDark">Dark</button>
        <span style="width:1px; background:var(--card-border); margin:2px 1px;"></span>
        <button class="btn-toggle" id="btnSec">Sec: Off</button>
        <button class="btn-toggle active" id="btnFmt">24H</button>
        <button class="btn-toggle" id="btnUnit">°C</button>
        <button class="btn-toggle" id="btnFs">⛶ Full</button>
      </div>

      <div class="weather-forecast-strip" id="weatherStrip"></div>
    </header>

    <main class="center-clock-stage">
      <div class="clock-digits">
        <span id="mainTime">00:00</span>
        <span id="mainSeconds" class="clock-seconds" style="display:none;">:00</span>
        <span id="mainAmpm" class="clock-ampm" style="display:none;">AM</span>
      </div>
    </main>

    <footer class="bottom-bar">
      <div class="hubs-grid" id="hubsList"></div>
      <div class="location-card">
        <div class="loc-city">Kirchberg, Luxembourg</div>
        <div class="loc-tz" id="gmtInfo">GMT+2 (CEST)</div>
      </div>
    </footer>
  </div>

  <script>
    const HUBS = [
      { name: "Dublin", zone: "Europe/Dublin" },
      { name: "London", zone: "Europe/London" },
      { name: "Frankfurt", zone: "Europe/Berlin" },
      { name: "Zurich", zone: "Europe/Zurich" },
      { name: "Istanbul", zone: "Europe/Istanbul" },
      { name: "New York", zone: "America/New_York" },
      { name: "Chicago", zone: "America/Chicago" },
      { name: "Cayman Islands", zone: "America/Cayman" },
      { name: "Singapore", zone: "Asia/Singapore" },
      { name: "Hong Kong", zone: "Asia/Hong_Kong" },
      { name: "Tokyo", zone: "Asia/Tokyo" },
      { name: "Sydney", zone: "Australia/Sydney" }
    ];

    let state = {
      theme: 'machine',
      showSeconds: false,
      use24Hour: true,
      tempUnit: 'C'
    };

    function applyTheme() {
      if (state.theme === 'machine') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-theme', state.theme);
      }
      document.getElementById('themeMachine').classList.toggle('active', state.theme === 'machine');
      document.getElementById('themeLight').classList.toggle('active', state.theme === 'light');
      document.getElementById('themeDark').classList.toggle('active', state.theme === 'dark');
    }

    function updateMainClock() {
      const now = new Date();

      // Date Top-Left
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      document.getElementById('dateIso').textContent = `${yyyy}-${mm}-${dd}`;
      document.getElementById('dayName').textContent = days[now.getDay()];

      // Main Clock
      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      let ampm = '';
      if (!state.use24Hour) {
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
      }
      const formattedHours = state.use24Hour ? String(hours).padStart(2, '0') : hours;

      document.getElementById('mainTime').textContent = `${formattedHours}:${mins}`;
      const secEl = document.getElementById('mainSeconds');
      secEl.textContent = `:${secs}`;
      secEl.style.display = state.showSeconds ? 'inline' : 'none';

      const ampmEl = document.getElementById('mainAmpm');
      ampmEl.textContent = ampm;
      ampmEl.style.display = !state.use24Hour ? 'inline' : 'none';

      // GMT / Local TZ info
      const offsetMinutes = -now.getTimezoneOffset();
      const offsetHours = offsetMinutes / 60;
      const sign = offsetHours >= 0 ? '+' : '';
      document.getElementById('gmtInfo').textContent = `(GMT${sign}${offsetHours})`;
    }

    function updateHubs() {
      const now = new Date();
      const sorted = HUBS.map(hub => {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: hub.zone,
          hour: 'numeric',
          minute: 'numeric',
          hour12: false,
          day: 'numeric'
        }).formatToParts(now);

        const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
        const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
        const day = parseInt(parts.find(p => p.type === 'day').value, 10);

        let formattedTime = '';
        if (state.use24Hour) {
          formattedTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        } else {
          const ampm = h >= 12 ? 'PM' : 'AM';
          const h12 = h % 12 || 12;
          formattedTime = `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
        }

        const dayDiff = day - now.getDate();
        let offsetTag = '';
        if (dayDiff === 1 || dayDiff < -25) offsetTag = '+1d';
        if (dayDiff === -1 || dayDiff > 25) offsetTag = '-1d';

        return { ...hub, minutesTotal: h * 60 + m, formattedTime, offsetTag };
      }).sort((a, b) => a.minutesTotal - b.minutesTotal);

      const hubsContainer = document.getElementById('hubsList');
      hubsContainer.innerHTML = sorted.map(h => `
        <div class="hub-pill">
          <span class="hub-name">${h.name}</span>
          <span class="hub-time">${h.formattedTime}</span>
          ${h.offsetTag ? `<span class="hub-day-offset">${h.offsetTag}</span>` : ''}
        </div>
      `).join('');
    }

    function renderWeather() {
      const mock = [
        { h: 'Now', c: 22, p: 0, icon: '🌤️' },
        { h: '+1h', c: 21, p: 0, icon: '⛅' },
        { h: '+2h', c: 20, p: 10, icon: '🌥️' },
        { h: '+3h', c: 19, p: 15, icon: '☁️' },
        { h: '+4h', c: 18, p: 25, icon: '🌦️' },
        { h: '+5h', c: 17, p: 40, icon: '🌧️' }
      ];

      const strip = document.getElementById('weatherStrip');
      strip.innerHTML = mock.map(w => {
        const tempVal = state.tempUnit === 'C' ? `${w.c}°` : `${Math.round(w.c * 9/5 + 32)}°`;
        return `
          <div class="weather-cell">
            <span class="weather-hour">${w.h}</span>
            <span class="weather-icon">${w.icon}</span>
            <span class="weather-temp">${tempVal}</span>
            <span class="weather-pop">${w.p}%</span>
          </div>
        `;
      }).join('');
    }

    // Toggle controls
    document.getElementById('themeMachine').onclick = () => { state.theme = 'machine'; applyTheme(); };
    document.getElementById('themeLight').onclick = () => { state.theme = 'light'; applyTheme(); };
    document.getElementById('themeDark').onclick = () => { state.theme = 'dark'; applyTheme(); };

    document.getElementById('btnSec').onclick = () => {
      state.showSeconds = !state.showSeconds;
      document.getElementById('btnSec').textContent = state.showSeconds ? 'Sec: On' : 'Sec: Off';
      document.getElementById('btnSec').classList.toggle('active', state.showSeconds);
      updateMainClock();
    };

    document.getElementById('btnFmt').onclick = () => {
      state.use24Hour = !state.use24Hour;
      document.getElementById('btnFmt').textContent = state.use24Hour ? '24H' : '12H';
      updateMainClock();
      updateHubs();
    };

    document.getElementById('btnUnit').onclick = () => {
      state.tempUnit = state.tempUnit === 'C' ? 'F' : 'C';
      document.getElementById('btnUnit').textContent = `°${state.tempUnit}`;
      renderWeather();
    };

    // Fullscreen trigger (handles Google Sites iframe restriction gracefully)
    document.getElementById('btnFs').onclick = () => {
      try {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {
            alert("Google Sites restricts fullscreen inside its page frame.\n\nTip: Press F11 in your browser or open the embed link directly in a tab for true full screen!");
          });
        } else {
          document.exitFullscreen();
        }
      } catch (e) {
        alert("Google Sites restricts fullscreen inside its frame. Press F11 for full screen.");
      }
    };

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'machine') applyTheme();
    });

    applyTheme();
    updateMainClock();
    updateHubs();
    renderWeather();

    setInterval(updateMainClock, 1000);
    setInterval(updateHubs, 10000);
  </script>
</body>
</html>
