<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time & Market Hubs Dashboard</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #09090b;
      --card-border: #222227;
      --text-main: #ffffff;
      --text-muted: #8e8e99;
      --lux-red: #D94848;
      --lux-white: #FFFFFF;
      --lux-blue: #3AAFE3;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --lux-red: #c93b3b;
      --lux-white: #0f172a;
      --lux-blue: #2395cb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dashboard {
      height: 100vh;
      width: 100vw;
      padding: 1.8rem 3rem 2.4rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Top: Centered Date */
    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .date-badge {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      padding: 9px 27px;
      border-radius: 9999px;
    }
    .date-iso {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--lux-blue);
      font-variant-numeric: tabular-nums;
    }
    .day-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Center Stage: Main Clock (-30% scaled) */
    .center-clock-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }
    .clock-digits {
      font-size: clamp(11.5rem, 35vw, 33.5rem);
      font-weight: 900;
      letter-spacing: -6px;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
    }
    .clock-hours {
      color: var(--lux-red);
    }
    .clock-colon {
      opacity: 0.16;
      margin: 0 0.04em;
      color: var(--text-muted);
      font-weight: 400;
    }
    .clock-minutes {
      color: var(--lux-white);
    }
    .clock-sec-colon {
      opacity: 0.16;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 0.08em;
      margin-right: 0.02em;
    }
    .clock-seconds {
      font-size: 0.28em;
      color: var(--lux-blue);
      font-weight: 700;
      opacity: 0.95;
    }
    .clock-ampm {
      font-size: 0.16em;
      margin-left: 0.2em;
      color: var(--lux-blue);
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    /* Bottom Row */
    .bottom-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 3rem;
      z-index: 10;
      pointer-events: auto;
    }

    /* Left: Vertically Stacked Hubs */
    .hubs-vertical-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 9px;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }
    .hubs-vertical-list::-webkit-scrollbar {
      width: 6px;
    }
    .hubs-vertical-list::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 6px;
    }

    .hub-pill {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 9px;
      padding: 5px 15px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      font-size: 1.08rem;
      min-width: 295px;
    }
    .hub-name {
      color: var(--text-muted);
      font-weight: 500;
      flex: 1;
    }
    .hub-time-box {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }
    .hub-day-offset-slot {
      width: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hub-day-offset {
      font-size: 0.85rem;
      color: var(--lux-blue);
      font-weight: 700;
      background: rgba(58, 175, 227, 0.14);
      padding: 2px 6px;
      border-radius: 5px;
      line-height: 1;
    }
    .hub-time {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      min-width: 62px;
      text-align: right;
    }

    /* Right Stack */
    .right-corner-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .controls-container {
      display: flex;
      gap: 5px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      padding: 6px 9px;
      border-radius: 9999px;
    }

    .btn-toggle {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 15px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .btn-toggle.active {
      background: var(--lux-red);
      color: #ffffff;
    }
    .btn-toggle:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255,255,255,0.06);
    }

    .weather-forecast-strip {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .weather-cell {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 11px;
      padding: 6px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 72px;
    }
    .weather-hour {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .weather-icon { font-size: 1.3rem; margin: 2px 0; }
    .weather-temp { font-size: 1.1rem; font-weight: 700; }
    .weather-pop { font-size: 0.88rem; color: var(--lux-blue); font-weight: 600; }

    .location-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 9px 21px;
      text-align: right;
      white-space: nowrap;
    }
    .loc-city { font-size: 1.25rem; font-weight: 700; }
    .loc-tz { font-size: 1.05rem; color: var(--lux-blue); font-weight: 600; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Top Centered Date -->
    <header class="top-bar">
      <div class="date-badge">
        <span class="date-iso" id="dateIso">----.--.--</span>
        <span class="day-name" id="dayName">---</span>
      </div>
    </header>

    <!-- Main Clock Stage (-30% Size) -->
    <main class="center-clock-stage">
      <div class="clock-digits">
        <span id="mainHours" class="clock-hours">00</span>
        <span class="clock-colon">:</span>
        <span id="mainMinutes" class="clock-minutes">00</span>
        <span id="colonSec" class="clock-sec-colon" style="display:none;">:</span>
        <span id="mainSeconds" class="clock-seconds" style="display:none;">00</span>
        <span id="mainAmpm" class="clock-ampm" style="display:none;">AM</span>
      </div>
    </main>

    <!-- Bottom Row -->
    <div class="bottom-row">
      <!-- Vertically Stacked Hubs -->
      <div class="hubs-vertical-list" id="hubsList"></div>

      <!-- Right Column: Controls, Weather, Location Stacked -->
      <div class="right-corner-stack">
        <!-- Switches -->
        <div class="controls-container">
          <button class="btn-toggle active" id="themeMachine">Auto</button>
          <button class="btn-toggle" id="themeLight">Light</button>
          <button class="btn-toggle" id="themeDark">Dark</button>
          <span style="width:2px; background:var(--card-border); margin:2px 2px;"></span>
          <button class="btn-toggle" id="btnSec">Sec: Off</button>
          <button class="btn-toggle active" id="btnFmt">24H</button>
          <button class="btn-toggle" id="btnUnit">°C</button>
        </div>

        <!-- Weather -->
        <div class="weather-forecast-strip" id="weatherStrip"></div>

        <!-- City Location Card -->
        <div class="location-card">
          <div class="loc-city">Kirchberg, Luxembourg</div>
          <div class="loc-tz" id="gmtInfo">GMT+2</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const HUBS = [
      { name: "Dublin", zone: "Europe/Dublin" },
      { name: "London", zone: "Europe/London" },
      { name: "Frankfurt", zone: "Europe/Berlin" },
      { name: "Zurich", zone: "Europe/Zurich" },
      { name: "Istanbul", zone: "Europe/Istanbul" },
      { name: "New York", zone: "America/New_York" },
      { name: "Chicago", zone: "America/Chicago" },
      { name: "Cayman Islands", zone: "America/Cayman" },
      { name: "Singapore", zone: "Asia/Singapore" },
      { name: "Hong Kong", zone: "Asia/Hong_Kong" },
      { name: "Tokyo", zone: "Asia/Tokyo" },
      { name: "Sydney", zone: "Australia/Sydney" }
    ];

    let state = {
      theme: 'machine',
      showSeconds: false,
      use24Hour: true,
      tempUnit: 'C'
    };

    function applyTheme() {
      if (state.theme === 'machine') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-theme', state.theme);
      }
      document.getElementById('themeMachine').classList.toggle('active', state.theme === 'machine');
      document.getElementById('themeLight').classList.toggle('active', state.theme === 'light');
      document.getElementById('themeDark').classList.toggle('active', state.theme === 'dark');
    }

    function updateMainClock() {
      const now = new Date();

      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      document.getElementById('dateIso').textContent = `${yyyy}-${mm}-${dd}`;
      document.getElementById('dayName').textContent = days[now.getDay()];

      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      let ampm = '';
      if (!state.use24Hour) {
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
      }
      const formattedHours = state.use24Hour ? String(hours).padStart(2, '0') : String(hours);

      document.getElementById('mainHours').textContent = formattedHours;
      document.getElementById('mainMinutes').textContent = mins;

      const secEl = document.getElementById('mainSeconds');
      const secColon = document.getElementById('colonSec');
      secEl.textContent = secs;
      secEl.style.display = state.showSeconds ? 'inline' : 'none';
      secColon.style.display = state.showSeconds ? 'inline' : 'none';

      const ampmEl = document.getElementById('mainAmpm');
      ampmEl.textContent = ampm;
      ampmEl.style.display = !state.use24Hour ? 'inline' : 'none';

      const offsetMinutes = -now.getTimezoneOffset();
      const offsetHours = offsetMinutes / 60;
      const sign = offsetHours >= 0 ? '+' : '';
      document.getElementById('gmtInfo').textContent = `(GMT${sign}${offsetHours})`;
    }

    function updateHubs() {
      const now = new Date();
      const sorted = HUBS.map(hub => {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: hub.zone,
          hour: 'numeric',
          minute: 'numeric',
          hour12: false,
          day: 'numeric'
        }).formatToParts(now);

        const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
        const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
        const day = parseInt(parts.find(p => p.type === 'day').value, 10);

        let formattedTime = '';
        if (state.use24Hour) {
          formattedTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        } else {
          const ampm = h >= 12 ? 'PM' : 'AM';
          const h12 = h % 12 || 12;
          formattedTime = `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
        }

        const dayDiff = day - now.getDate();
        const isNextDay = (dayDiff === 1 || dayDiff < -25);
        const isPrevDay = (dayDiff === -1 || dayDiff > 25);

        let offsetTag = '';
        let dayOrder = 0;
        if (isNextDay) {
          offsetTag = '+1d';
          dayOrder = 1;
        } else if (isPrevDay) {
          offsetTag = '-1d';
          dayOrder = -1;
        }

        return {
          ...hub,
          minutesTotal: h * 60 + m,
          dayOrder,
          formattedTime,
          offsetTag
        };
      }).sort((a, b) => {
        if (a.dayOrder !== b.dayOrder) {
          return a.dayOrder - b.dayOrder;
        }
        return a.minutesTotal - b.minutesTotal;
      });

      const hubsContainer = document.getElementById('hubsList');
      hubsContainer.innerHTML = sorted.map(h => `
        <div class="hub-pill">
          <span class="hub-name">${h.name}</span>
          <div class="hub-time-box">
            <span class="hub-day-offset-slot">
              ${h.offsetTag ? `<span class="hub-day-offset">${h.offsetTag}</span>` : ''}
            </span>
            <span class="hub-time">${h.formattedTime}</span>
          </div>
        </div>
      `).join('');
    }

    function renderWeather() {
      const now = new Date();
      const currentH = now.getHours();

      const weatherIcons = ['🌤️', '⛅', '🌥️', '☁️', '🌦️', '🌧️'];
      const temps = [22, 21, 20, 19, 18, 17];
      const pops = [0, 0, 10, 15, 25, 40];

      const strip = document.getElementById('weatherStrip');
      strip.innerHTML = temps.map((c, idx) => {
        const forecastDate = new Date(now);
        forecastDate.setHours(currentH + idx);
        const hVal = forecastDate.getHours();

        let hourLabel = '';
        if (state.use24Hour) {
          hourLabel = `${String(hVal).padStart(2, '0')}:00`;
        } else {
          const ampm = hVal >= 12 ? 'PM' : 'AM';
          const h12 = hVal % 12 || 12;
          hourLabel = `${h12} ${ampm}`;
        }

        const tempVal = state.tempUnit === 'C' ? `${c}°` : `${Math.round(c * 9/5 + 32)}°`;
        return `
          <div class="weather-cell">
            <span class="weather-hour">${hourLabel}</span>
            <span class="weather-icon">${weatherIcons[idx]}</span>
            <span class="weather-temp">${tempVal}</span>
            <span class="weather-pop">${pops[idx]}%</span>
          </div>
        `;
      }).join('');
    }

    document.getElementById('themeMachine').onclick = () => { state.theme = 'machine'; applyTheme(); };
    document.getElementById('themeLight').onclick = () => { state.theme = 'light'; applyTheme(); };
    document.getElementById('themeDark').onclick = () => { state.theme = 'dark'; applyTheme(); };

    document.getElementById('btnSec').onclick = () => {
      state.showSeconds = !state.showSeconds;
      document.getElementById('btnSec').textContent = state.showSeconds ? 'Sec: On' : 'Sec: Off';
      document.getElementById('btnSec').classList.toggle('active', state.showSeconds);
      updateMainClock();
    };

    document.getElementById('btnFmt').onclick = () => {
      state.use24Hour = !state.use24Hour;
      document.getElementById('btnFmt').textContent = state.use24Hour ? '24H' : '12H';
      updateMainClock();
      updateHubs();
      renderWeather();
    };

    document.getElementById('btnUnit').onclick = () => {
      state.tempUnit = state.tempUnit === 'C' ? 'F' : 'C';
      document.getElementById('btnUnit').textContent = `°${state.tempUnit}`;
      renderWeather();
    };

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'machine') applyTheme();
    });

    applyTheme();
    updateMainClock();
    updateHubs();
    renderWeather();

    setInterval(updateMainClock, 1000);
    setInterval(updateHubs, 10000);
    setInterval(renderWeather, 60000);
  </script>
</body>
</html>
